<!DOCTYPE html>
<html lang="en">
<head>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0HZN617CB1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0HZN617CB1');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Articles & Insights | Halocyberlife</title>
  <meta name="description" content="Explore esoteric articles, biophotonic research, and frequency-driven tech from Halocyberlife." />
  <meta name="author" content="Luis Amaya" />

<style>
/* =========================
   CORE DESIGN SYSTEM
========================= */
:root {
  --bg:#020617;
  --text:#f9fafb;
  --muted:#9ca3af;
  --soft:#d1d5db;
  --border:rgba(139,92,246,.3);
  --accent-cyan:#22d3ee;
  --accent-purple:#8b5cf6;
  --accent-magenta:#d946ef;
  --radius:18px;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at top right,#1e1b4b 0%,#020617 55%,#000 100%);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
}

.container{max-width:1100px;margin:0 auto;padding:0 1.5rem}

/* =========================
   HEADER
========================= */
header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(12px);
  background:linear-gradient(45deg,#000,transparent);
}

.header-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 0;
}

.brand{
  display:flex;
  gap:.7rem;
  align-items:center;
  text-decoration:none;
  color:#fff;
  font-weight:700;
  text-transform:uppercase;
}

.brand img{
  width:40px;
  filter:drop-shadow(0 0 5px var(--accent-cyan));
}

.neon-nav{
  display:flex;
  gap:.5rem;
}

.neon-nav a{
  padding:.5rem 1rem;
  border-radius:999px;
  border:1px solid var(--border);
  background:rgba(139,92,246,.1);
  color:#fff;
  text-decoration:none;
  font-size:.8rem;
}

.neon-nav-toggle{
  display:none;
}

/* MOBILE NAV */
@media(max-width:820px){
  .neon-nav-toggle{
    display:flex;
    flex-direction:column;
    gap:5px;
    background:none;
    border:none;
    cursor:pointer;
  }
  .neon-nav-toggle span{
    width:24px;height:3px;background:#fff;border-radius:3px;
  }
  .neon-nav{
    position:absolute;
    inset:auto 0 0 0;
    top:100%;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:1rem;
    padding:1.2rem 0;
    background:rgba(0,0,0,.92);
    border-top:1px solid var(--border);
  }
  .neon-nav.open{display:flex}
}

/* =========================
   HERO
========================= */
.hero{
  text-align:center;
  padding:5rem 0 3rem;
}

.hero h1{
  font-size:clamp(2.5rem,6vw,4rem);
  background:linear-gradient(to right,#fff,var(--accent-purple),var(--accent-magenta));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  color:var(--soft);
  font-size:1.2rem;
  max-width:700px;
  margin:1.2rem auto 2rem;
}

/* =========================
   GRID / CARDS
========================= */
.articles-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:30px;
}
@media(max-width:820px){
  .articles-grid{grid-template-columns:1fr}
}

.card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  background:rgba(139,92,246,.03);
  text-decoration:none;
  color:inherit;
  transition:.4s;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}

.card-img-wrap{
  aspect-ratio:21/9;
  overflow:hidden;
}

.card-img-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.card:hover img{scale:1.05}

.card-body{padding:1.5rem}

.card-meta{
  color:var(--accent-cyan);
  font-size:.75rem;
  font-weight:700;
  letter-spacing:1px;
}

.card-title{
  font-size:1.4rem;
  margin:.6rem 0;
}

.card-text{
  color:var(--muted);
  font-size:.95rem;
}

/* =========================
   LIGHTBOX
========================= */
.lightbox{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(12px);
  z-index:9999;
}
.lightbox.open{display:grid}

.lightbox__panel{
  position:relative;
  max-width:1100px;
  width:90%;
  background:#000;
  border-radius:20px;
  border:2px solid var(--accent-purple);
}

.lightbox__img{
  width:100%;
  max-height:80vh;
  object-fit:contain;
}

.lightbox__close{
  position:absolute;
  top:14px;
  right:14px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(139,92,246,.4);
  color:#fff;
  font-size:1.2rem;
  cursor:pointer;
}

/* =========================
   BACK TO TOP
========================= */
.back-to-top{
  position:fixed;
  right:1.2rem;
  bottom:1.2rem;
  display:none;
  width:46px;height:46px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.4),#020617);
  color:#fff;
  cursor:pointer;
  z-index:1200;
}
.back-to-top.show{display:grid;place-items:center}
</style>
</head>

<body>

<header>
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <img src="images/negative_white_halocyberlife_logo.png" alt="">
      <span>Halocyberlife</span>
    </a>

    <nav class="neon-nav">
      <a href="index.html">Home</a>
      <a href="blog.html">Articles</a>
      <a href="contact_us.html">Contact</a>
    </nav>

    <button class="neon-nav-toggle">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="container">

<section class="hero">
  <h1>Articles & Transmissions</h1>
  <p>Exploring the intersections of frequency, biophotonics, and esoteric architecture.</p>
</section>

<div class="articles-grid">

  <a class="card">
    <div class="card-img-wrap">
      <img src="images/Resonance_Light.png" class="lightbox-trigger">
    </div>
    <div class="card-body">
      <p class="card-meta">Experiments & Tech</p>
      <h2 class="card-title">BioGlow</h2>
      <p class="card-text">Resonance-driven experimental luminescence.</p>
    </div>
  </a>

</div>
</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lightbox__panel">
    <button class="lightbox__close">✕</button>
    <img id="lightboxImg" class="lightbox__img">
  </div>
</div>

<button class="back-to-top">↑</button>

<script>
document.addEventListener('DOMContentLoaded',()=>{

  /* MOBILE NAV */
  const toggle=document.querySelector('.neon-nav-toggle');
  const nav=document.querySelector('.neon-nav');
  toggle?.addEventListener('click',()=>nav.classList.toggle('open'));

  /* BACK TO TOP */
  const btt=document.querySelector('.back-to-top');
  window.addEventListener('scroll',()=>{
    btt.classList.toggle('show',window.scrollY>300);
  });
  btt?.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

  /* LIGHTBOX */
  const lb=document.getElementById('lightbox');
  const lbImg=document.getElementById('lightboxImg');
  const close=lb.querySelector('.lightbox__close');

  document.querySelectorAll('.lightbox-trigger').forEach(img=>{
    img.addEventListener('click',()=>{
      lb.classList.add('open');
      lbImg.src=img.src;
      document.body.style.overflow='hidden';
    });
  });

  function closeLB(){
    lb.classList.remove('open');
    lbImg.src='';
    document.body.style.overflow='';
  }

  close.addEventListener('click',e=>{
    e.stopPropagation();
    closeLB();
  });

  lb.addEventListener('click',e=>{
    if(e.target===lb) closeLB();
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && lb.classList.contains('open')) closeLB();
  });

});
</script>

</body>
</html>
