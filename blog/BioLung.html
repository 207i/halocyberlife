  <style>
    :root {
      --bg: #020617;
      --bg-soft: #050814;
      --panel: rgba(255,255,255,0.03);
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: rgba(139,92,246,0.28);
      --accent-purple: #8b5cf6;
      --accent-cyan: #22d3ee;
      --accent-magenta: #d946ef;
      --accent-gold: #fbbf24;
      --radius: 20px;
      --shadow-purple: 0 0 30px rgba(139,92,246,0.15);
      --shadow-cyan: 0 0 24px rgba(34,211,238,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b 0%, #020617 50%, #000 100%);
      color: var(--text);
      line-height: 1.75;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .neon-header {
      position: sticky;
      top: 0;
      height: 72px;
      z-index: 9999;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .neon-header-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .neon-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      z-index: 10001;
    }

    .neon-logo {
      max-height: 40px;
      display: block;
      filter: drop-shadow(0 0 5px var(--accent-purple));
    }

    .brand-text {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem;
      color: #fff;
    }

    .neon-nav {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .neon-link {
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #fff;
      border: 2px solid currentColor;
      background: rgba(255, 255, 255, 0.03);
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .color-blue    { color: #4cc3ff; }
    .color-purple  { color: #c084fc; }
    .color-cyan    { color: #5ffffa; }
    .color-magenta { color: #ff5df7; }
    .color-gold    { color: #ffe27a; }

    .neon-link:hover {
      box-shadow: 0 0 20px currentColor, inset 0 0 12px currentColor;
      background: currentColor;
      color: #000;
      transform: translateY(-2px);
    }

    .neon-nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
    }

    .neon-nav-toggle span {
      width: 24px;
      height: 3px;
      background: #fff;
      border-radius: 3px;
    }

    .hero {
      padding: 4.5rem 0 2rem;
      text-align: center;
    }

    .hero-kicker {
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-weight: 700;
      font-size: 0.74rem;
      margin-bottom: 1rem;
    }

    .hero-title {
      font-size: clamp(2.6rem, 7vw, 5rem);
      line-height: 1.05;
      background: linear-gradient(to right, #fff, var(--accent-purple), var(--accent-cyan), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      max-width: 850px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .article-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 2rem;
      margin: 2rem 0 5rem;
    }

    .article-banner {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(34,211,238,0.12), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(217,70,239,0.14), transparent 28%),
        linear-gradient(135deg, rgba(139,92,246,0.12), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow-purple);
    }

    .article-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.035), transparent);
      pointer-events: none;
    }

    .banner-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .meta-pill {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--accent-cyan);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      font-weight: 700;
    }

    .article-banner h1 {
      font-size: clamp(2rem, 5vw, 3.7rem);
      line-height: 1.08;
      margin-bottom: 1rem;
      color: #fff;
    }

    .article-banner p {
      max-width: 820px;
      color: #dbe4f0;
      font-size: 1.06rem;
    }

    .article-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 2rem;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 95px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      box-shadow: var(--shadow-cyan);
    }

    .sidebar h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-gold);
      margin-bottom: 1rem;
    }

    .toc {
      list-style: none;
      display: grid;
      gap: 0.7rem;
    }

    .toc a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: 0.25s;
    }

    .toc a:hover {
      color: var(--accent-cyan);
    }

    .sidebar-note {
      margin-top: 1.3rem;
      padding-top: 1.1rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .article-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow-purple);
    }

    .article-card p {
      margin-bottom: 1.25rem;
      color: #e5e7eb;
      font-size: 1.03rem;
    }

    .article-card h2 {
      margin: 2.4rem 0 1rem;
      color: #fff;
      font-size: clamp(1.45rem, 3vw, 2rem);
      line-height: 1.2;
    }

    .article-card h3 {
      margin: 1.7rem 0 0.8rem;
      color: var(--accent-cyan);
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .article-card strong {
      color: #fff;
    }

    .article-card blockquote {
      margin: 1.6rem 0;
      padding: 1.2rem 1.2rem 1.2rem 1.4rem;
      border-left: 4px solid var(--accent-purple);
      background: rgba(139, 92, 246, 0.08);
      color: #f3f4f6;
      border-radius: 0 14px 14px 0;
      font-size: 1.05rem;
    }

    .article-card ul {
      margin: 1rem 0 1.5rem 1.2rem;
      color: #e5e7eb;
    }

    .article-card li {
      margin-bottom: 0.6rem;
    }

    .signal-box {
      margin: 2rem 0;
      padding: 1.25rem;
      border: 1px solid rgba(34,211,238,0.25);
      border-radius: 16px;
      background: rgba(34,211,238,0.05);
    }

    .signal-box h4 {
      color: var(--accent-cyan);
      text-transform: uppercase;
      font-size: 0.86rem;
      letter-spacing: 0.14em;
      margin-bottom: 0.65rem;
    }

    .article-endcap {
      margin-top: 2.5rem;
      padding: 1.6rem;
      border-radius: 18px;
      border: 1px solid rgba(251,191,36,0.25);
      background: rgba(251,191,36,0.05);
    }

    .article-endcap h3 {
      color: var(--accent-gold);
      margin-top: 0;
    }

    .return-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }

    .return-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 999px;
      padding: 0.8rem 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.82rem;
      transition: 0.25s;
    }

    .return-primary {
      border: 2px solid var(--accent-purple);
      color: var(--accent-purple);
      background: rgba(139,92,246,0.06);
    }

    .return-primary:hover {
      background: var(--accent-purple);
      color: #000;
      box-shadow: 0 0 22px rgba(139,92,246,0.35);
    }

    .return-secondary {
      border: 2px solid var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(34,211,238,0.05);
    }

    .return-secondary:hover {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 22px rgba(34,211,238,0.35);
    }

    .site-footer {
      background: #010409;
      border-top: 1px solid var(--border);
      padding: 5rem 0 3rem;
      margin-top: 6rem;
      color: var(--muted);
    }

    .footer-grid {
      display: grid;
      gap: 3rem;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      align-items: start;
    }

    .footer-title {
      color: #fff;
      text-transform: uppercase;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    .footer-list {
      list-style: none;
      font-size: 0.9rem;
    }

    .footer-list li {
      margin-bottom: 0.8rem;
    }

    .footer-list a {
      color: var(--muted);
      text-decoration: none;
      transition: 0.3s;
    }

    .footer-list a:hover {
      color: var(--accent-cyan);
    }

    #backToTop {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(10px);
      border: 2px solid var(--accent-cyan);
      color: var(--accent-cyan);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      z-index: 2000;
      transition: all 0.35s ease;
      opacity: 0;
      visibility: hidden;
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
    }

    #backToTop.show {
      opacity: 1;
      visibility: visible;
    }

    #backToTop:hover {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 25px var(--accent-cyan);
      transform: translateY(-5px);
    }

    @media (max-width: 980px) {
      .article-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        order: 2;
      }
    }

        gap: 2rem;
