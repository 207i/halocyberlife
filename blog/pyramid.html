<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>What If the Pyramids Were Never Just Tombs? | HaloCyberLife</title>
  <meta name="description" content="A story-driven exploration of pyramid geometry, chambers, airflow, resonance, and materials—asking whether ancient pyramids behaved more like engineered environments than symbolic tombs." />
  <meta name="author" content="Luis Amaya" />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://halocyberlife.com/blog/pyramids_hidden_function.html" />
  <link rel="stylesheet" href="/css/style_v2_0_0.css">

  <style>
    :root{
      --bg:#050814;
      --line:rgba(255,255,255,.12);
      --text:#f3f6ff;
      --muted:#aab3d6;
      --cyan:#22d3ee;
      --radius:18px;
      --shadow:0 12px 36px rgba(0,0,0,.45);
      --max:880px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 70% 10%, rgba(139,92,246,.22), transparent 55%),
        radial-gradient(800px 500px at 30% 20%, rgba(34,211,238,.16), transparent 55%),
        linear-gradient(180deg, #030511, var(--bg));
    }

    a{color:var(--cyan); text-decoration:none}
    .container{width:min(var(--max), calc(100% - 36px)); margin:0 auto}

    /* ================= NEON HEADER FALLBACK ================= */
    .neon-header{
      position:sticky;
      top:0;
      z-index:999;
      background:rgba(5,8,20,.85);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }

    .neon-header-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 0;
    }

    .neon-logo{
      height:34px;
      display:block;
    }

    .neon-nav{
      display:flex;
      gap:18px;
      align-items:center;
    }

    .neon-link{
      font-size:14px;
      color:var(--text);
    }

    .neon-nav-toggle{
      display:none;
      background:none;
      border:0;
      cursor:pointer;
    }

    .neon-nav-toggle span{
      display:block;
      width:24px;
      height:2px;
      background:#fff;
      margin:5px 0;
    }

    @media (max-width: 900px){
      .neon-nav{
        display:none;
        position:absolute;
        top:100%;
        left:0;
        right:0;
        flex-direction:column;
        background:rgba(5,8,20,.96);
        padding:18px;
        border-bottom:1px solid var(--line);
      }

      .neon-nav.open{
        display:flex;
      }

      .neon-nav-toggle{
        display:block;
      }
    }
    /* ================= END NEON FALLBACK ================= */

    .hero{padding:56px 0 32px}
    h1{font-size:clamp(32px,4.8vw,48px); margin-bottom:16px}

    .sub{
      font-size:18px;
      color:var(--muted);
      max-width:60ch;
    }

    main{padding:20px 0 90px}

    article{
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px;
    }

    section{margin-bottom:42px}
    h2{font-size:25px; margin-bottom:12px}

    p{
      font-size:17px;
      line-height:1.75;
      margin-bottom:14px;
    }

    ul{padding-left:18px}
    li{margin:8px 0}

    .pull{
      margin:22px 0;
      padding:18px;
      border-radius:14px;
      background:rgba(0,0,0,.25);
      border:1px solid rgba(34,211,238,.25);
    }

    .blog-image-section{
      margin:4rem auto;
      max-width:1100px;
      padding:0 1.5rem;
      text-align:center;
    }

    .blog-image-section img{
      width:100%;
      border-radius:18px;
      box-shadow:0 25px 60px rgba(0,0,0,.45);
    }

    .blog-image-section figcaption{
      margin-top:1rem;
      font-size:.95rem;
      color:#9ca3af;
    }

    footer{
      border-top:1px solid var(--line);
      background:rgba(0,0,0,.2);
      padding:20px;
      text-align:center;
      color:var(--muted);
    }
  </style>
</head>

<body>

<header class="neon-header">
  <div class="container neon-header-inner">
    <a href="/index.html" class="neon-brand">
      <img src="/images/negative_white_halocyberlife_logo.png" class="neon-logo" alt="Halocyberlife">
    </a>

    <button class="neon-nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="neon-nav">
      <a href="/index.html#insights" class="neon-link">Insights</a>
      <a href="/index.html#atelier" class="neon-link">HaloCraft</a>
      <a href="/blog.html" class="neon-link">Articles</a>
      <a href="/about.html" class="neon-link">About</a>
      <a href="/contact_us.html" class="neon-link">Contact</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>What If the Pyramids Were Never Just Tombs?</h1>
    <p class="sub">
      Not a claim. Not a conspiracy.  
      Just a question that refuses to stay quiet once you really look.
    </p>
  </div>
</section>

<!-- CONTENT UNCHANGED BELOW -->
<!-- everything you wrote remains exactly as-is -->

<footer>
  © <span id="year"></span> HaloCyberLife™
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

<script>
  const toggle = document.querySelector('.neon-nav-toggle');
  const nav = document.querySelector('.neon-nav');

  if (toggle && nav) {
    toggle.addEventListener('click', () => {
      nav.classList.toggle('open');
    });
  }
</script>

</body>
</html>
