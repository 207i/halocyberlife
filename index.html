  <meta charset="UTF-8" />

  <title>HaloCyberLife™ | Esoteric Wisdom & Future Technology</title>
  <meta name="description" content="HaloCyberLife explores frequency intelligence, consciousness, ancient architecture, and future technology through research, patents, and practical insights." />

  <link rel="icon" href="/images/favicon.ico" sizes="any" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="preload" href="style_v2_0_0.css" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <style>
    /* ===== FIX 1: MOBILE NAV DISPLAY LOGIC ===== */
    @media (max-width: 767px) {
      .neon-nav {
        display: none; /* Hidden by default on mobile */
        flex-direction: column;
        position: absolute;
        top: 100%; /* Sits right under header */
        left: 0;
        width: 100%;
        background: rgba(5, 8, 20, 0.95);
        backdrop-filter: blur(15px);
        padding: 2rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }

      /* This is the class the JS toggles */
      .neon-nav.open {
        display: flex !important;
      }

      .neon-nav-toggle {
        display: flex !important;
        z-index: 100001; /* Above everything */
        pointer-events: auto !important; /* Forces clickability */
      }
    }

    /* ===== FIX 2: PREVENT HERO OVERLAP ===== */
    .hero-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      perspective: 800px;
      pointer-events: none; /* Let clicks pass through to background */
      z-index: 1; 
    }

    .neon-header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 99999 !important;
      background: rgba(5, 8, 20, 0.8);
      backdrop-filter: blur(10px);
    }

    /* ===== MARQUEE & ANIMATIONS (Your existing code) ===== */
    .marquee {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,.08);
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(5,8,20,.65);
      backdrop-filter: blur(8px);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee-scroll 40s linear infinite;
    }

    @keyframes marquee-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .orb {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      will-change: transform;
    }

    .orb-outer {
      width: 320px;
      height: 320px;
      z-index: 1;
      background: radial-gradient(circle at 30% 30%, rgba(139,92,246,.6), rgba(88,28,135,.85) 55%, rgba(5,8,20,.95) 70%);
      animation: slow-spin 120s linear infinite, slow-drift 24s ease-in-out infinite alternate;
    }

    .orb-inner {
      width: 180px;
      height: 180px;
      z-index: 5;
      background: radial-gradient(circle at 35% 35%, rgba(34,211,238,.7), rgba(6,95,113,.85) 55%, rgba(5,8,20,.95) 70%);
      animation: slow-spin-reverse 90s linear infinite, pulse-glow 8s ease-in-out infinite;
    }

    @keyframes slow-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes slow-spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes slow-drift { from { transform: translateY(0); } to { transform: translateY(-14px); } }
    @keyframes pulse-glow { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }

    /* COMET SYSTEM */
    .comet-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 3; }
    .comet {
      position: absolute;
      width: 6px; height: 6px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 12px #fff, 0 0 28px rgba(34,211,238,0.5);
      animation: comet-fly 20s linear infinite;
      opacity: 0;
    }

    @keyframes comet-fly {
      0% { transform: translate(-20vw, 30vh); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0; }
      100% { transform: translate(120vw, -50vh); }
    }
  </style>
</head>
<body>

<header class="neon-header">
  <div class="container neon-header-inner" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem;">
    
    <a href="/index.html" class="neon-brand">
      <img src="./images/negative_white_halocyberlife_logo.png" alt="Logo" style="height: 40px;" />
    </a>

    <button class="neon-nav-toggle" aria-label="Toggle menu" style="display: none; background: none; border: none; cursor: pointer; padding: 10px;">
      <div style="width: 25px; height: 2px; background: white; margin: 4px 0;"></div>
      <div style="width: 25px; height: 2px; background: white; margin: 4px 0;"></div>
      <div style="width: 25px; height: 2px; background: white; margin: 4px 0;"></div>
    </button>

    <nav id="primary-nav" class="neon-nav">
      <a href="/index.html#insights" class="neon-link">Insights</a>
      <a href="/index.html#atelier" class="neon-link">HaloCraft</a>
      <a href="/blog.html" class="neon-link">Articles</a>
      <a href="/about.html" class="neon-link">About</a>
      <a href="/contact_us.html" class="neon-link">Contact</a>
    </nav>
  </div>
</header>

<main style="padding-top: 80px;">
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-copy">
        <h2 class="hero-kicker">Version 2.0.0 · Knowledge First</h2>
        <h1 class="hero-title">Your Portal to Esoteric Wisdom,<br />Frequency Intelligence & Future Tools.</h1>
        <div class="hero-actions">
          <a href="#insights" class="btn primary-btn">Read Latest Insights</a>
        </div>
      </div>
      <div class="hero-visual">
        <div class="orb orb-outer"></div>
        <div class="orb orb-inner"></div>
        <div class="comet-layer">
          <div class="comet"></div>
        </div>
      </div>
    </div>
  </section>
  
  </main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggle = document.querySelector(".neon-nav-toggle");
  const nav = document.querySelector(".neon-nav");

  if (toggle && nav) {
    toggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = nav.classList.toggle("open");
      toggle.setAttribute("aria-expanded", isOpen);
      console.log("Menu toggled:", isOpen);
    });

    // Close on link click
    nav.querySelectorAll('.neon-link').forEach(link => {
      link.addEventListener('click', () => {
        nav.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
      });
    });

    // Close on click outside
    document.addEventListener("click", (e) => {
      if (!nav.contains(e.target) && !toggle.contains(e.target)) {
        nav.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
      }
    });
  }
});
</script>
</body>
</html>
